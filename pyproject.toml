[project]
name = "devfest-adk-multiagent"
version = "0.1.0"
description = "Google ADK multi-agent workshop: an orchestrator over finance, trading and marketing agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "filelock==4.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devfest_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the compose Postgres on localhost:5432 (make up first)",
]
addopts = "-m 'not integration'"

[tool.uv]
# cryptography 47+ dies with "Illegal instruction" in Podman's Linux VM on Apple Silicon.
constraint-dependencies = ["cryptography<47"]
